version: '3.9'

services:
  app:
    build: .
    container_name: nutriscan-ai
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=change-this-secret-in-production
      - DATABASE_URL=sqlite:///food_health.db
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
      - nutriscan_db:/app/instance
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  nutriscan_db:
